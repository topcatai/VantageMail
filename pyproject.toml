[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vantage-mail"
version = "1.0.0"
description = "Vantage Mail Email Client"
authors = [
    {name = "Developer", email = "dev@example.com"}
]
dependencies = [
    "pywin32>=306",  # For Windows-specific features and Outlook COM integration (optional)
    "requests>=2.31.0",  # For HTTP requests (Graph API)
    "msal>=1.28.0",  # Microsoft Authentication Library
    "icalendar>=6.0.0",  # For iCal parsing (calendar)
    "PyQt6>=6.6.0",  # For modern GUI (can switch to PySide6 if preferred)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/vantage-mail"

[tool.setuptools.packages.find]
where = ["src"]